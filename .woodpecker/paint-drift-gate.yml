when:
  - event: [push, pull_request, manual]

steps:
  - name: paint-drift-gate
    # W6.3 (#1462): the DETERMINISTIC paint-drift eval — a regenerated canonical_plate must keep its
    # painted set pieces on the authored logical cells (qa/check_plate_drift.py). Its own pipeline
    # because the check needs the qa image stack (Pillow + numpy), which the engine venv is
    # intentionally free of (so those heavy deps never touch the engine/rules/voice suites).
    image: python:3.12-slim
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends bash git
      - rm -rf /var/lib/apt/lists/*
      - >-
        bash -lc 'set -euo pipefail;
        if [ "${CI_PIPELINE_EVENT:-}" = "pull_request" ]; then
          _ref="${CI_COMMIT_REF:-}";
          if [ -z "$_ref" ] && [ -n "${CI_COMMIT_PULL_REQUEST:-}" ]; then _ref="refs/pull/${CI_COMMIT_PULL_REQUEST}/merge"; fi;
          case "$_ref" in
            refs/pull/*/merge) git fetch --no-tags --depth=1 origin "$_ref"; git checkout --force FETCH_HEAD; echo "checked out $_ref at $(git rev-parse HEAD)" ;;
            *) echo "pull_request event without merge ref: ${_ref:-empty}"; exit 1 ;;
          esac;
        fi'
      - python3 -m pip install --disable-pip-version-check --no-input pillow numpy pytest
      # manifests are regeneratable from the seeds (never silently stale)
      - python3 qa/build_room_manifest.py --check
      # known-good plate PASSes + a synthetic 2-cell shift is CAUGHT (single-process)
      - python3 -m pytest qa/test_plate_drift_gate.py -q -p no:xdist
      # every room_recipes.json canonical_plate with a committed manifest + plate
      - python3 qa/check_plate_drift.py gate-recipes
