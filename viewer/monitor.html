<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ClawDnD — Campaign Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Unified with the dashboard's warm "ink & candle-gold" system (was a cold flat blue-gray
     tool). Real typefaces: Cinzel engraves titles, Inter keeps the chrome crisp. */
  :root {
    color-scheme: dark;
    --bg:#100d0a; --panel:#19140f; --panel2:#1f1912; --ink:#ece4d6; --dim:#a99d86; --faint:#6f6657;
    --line:#352c20; --card-line:#4a3d28; --gold:#e8c98a; --gold2:#caa15e;
    --live:#7fd39b; --play:#e8c98a; --qa:#caa15e; --bad:#e08f8f; --good:#7fd39b;
    --font-display:'Cinzel',Georgia,serif; --font-ui:'Inter',system-ui,-apple-system,sans-serif;
    --e1:0 1px 2px rgba(0,0,0,.5);
    --e2:0 6px 18px -8px rgba(0,0,0,.66), 0 1px 0 rgba(232,201,138,.05) inset;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-ui);
    background-image: radial-gradient(135% 85% at 50% -12%, rgba(232,201,138,.06), transparent 55%);
    background-attachment: fixed; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(16,13,10,.9);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 14px 22px;
    display: flex; align-items: baseline; gap: 16px; }
  header h1 { font-family: var(--font-display); font-size: 18px; font-weight: 600; margin: 0;
    letter-spacing: .04em; color: var(--gold); }
  header h1 span { font-family: var(--font-ui); font-weight: 400; letter-spacing: 0; }
  header .sub { color: var(--dim); font-size: 13px; }
  header .sub b { color: var(--ink); }
  .pulse { color: var(--live); }
  #grid { display: grid; gap: 16px; padding: 20px 22px 48px;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
  .card { background: linear-gradient(180deg, var(--panel), #15110c); border: 1px solid var(--card-line);
    border-radius: 13px; box-shadow: var(--e2); padding: 15px 17px; display: flex; flex-direction: column;
    gap: 9px; transition: transform .14s, box-shadow .14s, border-color .14s; }
  .card:hover { transform: translateY(-2px); border-color: var(--gold2);
    box-shadow: 0 14px 30px -12px rgba(0,0,0,.72), 0 0 0 1px rgba(232,201,138,.08) inset; }
  .card.live { border-color: #3a5a44; box-shadow: var(--e2), 0 0 0 1px rgba(127,211,155,.18) inset; }
  .card .top { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
  .card .name { font-family: var(--font-display); font-weight: 600; font-size: 15.5px;
    letter-spacing: .02em; color: var(--gold); }
  .card a.name { color: var(--gold); text-decoration: none; }
  .card a.name:hover { color: #f4dca2; text-decoration: underline; }
  .badge { font-family: var(--font-ui); font-size: 11px; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
  .badge.live { color: #100d0a; background: var(--live); border-color: var(--live); font-weight: 700;
    display: inline-flex; align-items: center; gap: 5px; }
  .badge.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #0c3a20;
    animation: livepulse 1.6s infinite; }
  .badge.root-play { color: var(--gold); border-color: var(--card-line); }
  .badge.root-qa { color: var(--qa); border-color: #4d4326; }
  .meta { color: var(--dim); font-size: 12.5px; }
  .meta .k { color: var(--ink); }
  .party { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 11.5px; padding: 2px 8px; border-radius: 6px; background: var(--panel2);
    border: 1px solid var(--line); }
  .chip.dead { color: var(--bad); border-color: #5e2d2d; text-decoration: line-through; }
  .chip.companion { border-color: #3a4d2d; }
  .foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--dim);
    font-size: 12px; border-top: 1px solid var(--line); padding-top: 8px; margin-top: 2px; }
  .score { font-weight: 700; }
  .score.good { color: var(--good); } .score.mid { color: var(--qa); } .score.low { color: var(--bad); }
  .status { font-weight: 700; }
  .status.good { color: var(--good); } .status.low { color: var(--bad); } .status.unknown { color: var(--dim); }
  .ago { margin-left: auto; }
  .empty { color: var(--dim); padding: 72px 20px; text-align: center; font: italic 16px/1.6 Georgia, serif; }
  .empty::before { content: "❧"; display: block; font: 34px/1 var(--font-display); color: var(--gold2); margin-bottom: 12px; }
  a:focus-visible, .card:focus-visible { outline: 2px solid var(--gold2); outline-offset: 2px; }
  @keyframes livepulse { 0% { box-shadow: 0 0 0 0 rgba(12,58,32,.7); } 70% { box-shadow: 0 0 0 7px rgba(12,58,32,0); } 100% { box-shadow: 0 0 0 0 rgba(12,58,32,0); } }
  @media (prefers-reduced-motion: reduce) { .badge.live::before { animation: none; } .card { transition: none; } }
</style>
</head>
<body>
<header>
  <h1>ClawDnD <span style="color:var(--dim)">· Campaign Monitor</span></h1>
  <div class="sub" id="summary">loading…</div>
  <div class="sub" style="margin-left:auto" id="refresh">↻ live</div>
</header>
<div id="grid"></div>
<div class="empty" id="empty" hidden>No campaigns yet — start one (the play dashboard) or kick off a QA run.</div>
<script>
const grid = document.getElementById('grid');
const summaryEl = document.getElementById('summary');
const emptyEl = document.getElementById('empty');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ago(sec) {
  if (sec < 60) return Math.max(0, Math.round(sec)) + 's ago';
  if (sec < 3600) return Math.round(sec/60) + 'm ago';
  if (sec < 86400) return Math.round(sec/3600) + 'h ago';
  return Math.round(sec/86400) + 'd ago';
}
function scoreClass(v) { return v == null ? '' : (v >= 4.3 ? 'good' : v >= 3.5 ? 'mid' : 'low'); }
function statusClass(v) {
  const s = String(v ?? '').toUpperCase();
  if (s === 'PASS' || s === 'GREEN') return 'good';
  if (s === 'FAIL' || s === 'RED') return 'low';
  return 'unknown';
}
function card(c, now) {
  const root = String(c.root ?? '');
  const isPlay = root === 'play';
  const run = root.replace(/^qa:/, '');
  const live = c.live ? '<span class="badge live">● LIVE</span>' : '';
  const rootCls = isPlay ? 'root-play' : 'root-qa';
  const rootLbl = isPlay ? 'play' : 'QA · ' + run;
  // The HEADING is the campaign's IDENTITY: a play campaign uses its world/title (the owner's
  // game); a QA run uses its RUN NAME (e.g. "fidelity1") — every QA run shares the same world
  // title, so showing that made the whole grid look like one frozen campaign. Play campaigns open
  // the dashboard; a FINISHED QA run opens its distilled transcript; a still-playing run isn't yet
  // linkable. The world title for QA moves to the meta line below.
  const heading = isPlay ? esc(c.name || c.id) : esc(run);
  let title;
  if (isPlay) {
    title = `<a class="name" href="/dashboard?campaign=${encodeURIComponent(c.id)}" target="_blank">${heading}</a>`;
  } else if (c.transcript) {
    title = `<a class="name" href="/transcript?run=${encodeURIComponent(run)}" target="_blank">${heading}</a>`;
  } else {
    title = `<span class="name">${heading}</span>`;
  }
  const meta = [
    (!isPlay && c.name) && `<span class="k">${esc(c.name)}</span>`,  // world title (QA heading is the run)
    c.world && esc(c.world),
    c.ending && `ending: ${esc(c.ending)}`,
    (c.day != null) && `Day ${esc(c.day)}`,
    c.tenor && `tenor: ${esc(c.tenor)}`,
  ].filter(Boolean).join(' &nbsp;·&nbsp; ');
  const party = (c.party || []).map(p =>
    `<span class="chip ${p.dead ? 'dead' : ''} ${p.kind === 'companion' ? 'companion' : ''}">${esc(p.name)} ${esc(p.hp)}</span>`
  ).join('');
  const scores = c.scores || {};
  const scoreBadges = ['mechanical','story'].filter(k => typeof scores[k] === 'number').map(k =>
    `<span>${k[0].toUpperCase()}: <span class="score ${scoreClass(scores[k])}">${scores[k]}</span></span>`
  ).join(' &nbsp; ');
  const readinessBadges = (!isPlay ? ['behavioral','fiction','release'].map(k => {
    const status = String(scores[k] ?? 'UNKNOWN').toUpperCase();
    return `<span>${k[0].toUpperCase()}: <span class="status ${statusClass(status)}">${esc(status)}</span></span>`;
  }).join(' &nbsp; ') : '');
  const blockerTitle = (c.blockers || []).length ? ` title="${esc((c.blockers || []).slice(0, 3).join(' | '))}"` : '';
  const releaseMeta = (!isPlay && (c.release_cell || c.run_id))
    ? `<span${blockerTitle}>${c.release_cell ? `cell: ${esc(c.release_cell)}` : `run: ${esc(c.run_id)}`}</span>` : '';
  const counts = [
    (c.quest_hooks ? `${c.quest_hooks} hooks` : ''),
    (c.quest_outcomes ? `${c.quest_outcomes} quests` : ''),
    (c.npc_count ? `${c.npc_count} NPCs` : ''),
  ].filter(Boolean).join(' · ');
  return `<div class="card ${c.live ? 'live' : ''}">
    <div class="top">${title} <span class="badge ${rootCls}">${esc(rootLbl)}</span></div>
    ${live}
    <div class="meta">${meta || '<span style="color:#6b7280">unstarted</span>'}</div>
    ${c.location ? `<div class="meta">📍 ${esc(c.location)}</div>` : ''}
    ${party ? `<div class="party">${party}</div>` : ''}
    <div class="foot">
      ${counts ? `<span>${esc(counts)}</span>` : ''}
      ${scoreBadges ? `<span>${scoreBadges}</span>` : ''}
      ${readinessBadges ? `<span>${readinessBadges}</span>` : ''}
      ${releaseMeta}
      <span class="ago">${ago(now - c.updated_at)}</span>
    </div>
  </div>`;
}
async function tick() {
  try {
    const r = await fetch('/monitor.json', { cache: 'no-store' });
    const { campaigns, total, now } = await r.json();
    emptyEl.hidden = campaigns.length > 0;
    grid.innerHTML = campaigns.map(c => card(c, now)).join('');
    const liveN = campaigns.filter(c => c.live).length;
    const playN = campaigns.filter(c => c.root === 'play').length;
    const more = (total && total > campaigns.length) ? ` <span style="color:var(--dim)">(showing ${campaigns.length} most recent)</span>` : '';
    // Tell the owner when the grid is ONLY QA runs — otherwise a wall of identical QA cards reads
    // as "my game is frozen" when really no play game has been started yet.
    const hint = (campaigns.length > 0 && playN === 0)
      ? ` <span style="color:var(--qa)">· no play game yet — start one in the dashboard</span>` : '';
    summaryEl.innerHTML = `<b>${total ?? campaigns.length}</b> campaigns · <b class="pulse">${liveN}</b> live${more}${hint}`;
    document.getElementById('refresh').textContent = '↻ ' + new Date().toLocaleTimeString();
  } catch (e) {
    summaryEl.textContent = 'monitor offline (is the viewer running?)';
  }
}
tick();
setInterval(tick, 3000);
</script>
</body>
</html>
