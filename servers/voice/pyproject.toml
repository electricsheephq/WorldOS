[project]
name = "clawdnd-voice"
version = "0.0.1"
description = "WorldOS voice MCP: swappable text-to-speech (Kokoro local default; ElevenLabs optional)."
requires-python = ">=3.11,<3.13"
dependencies = [
  "mcp>=1.2.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6.0", "pytest-timeout>=2.3"]
kokoro = ["kokoro>=0.9.4", "soundfile>=0.13.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--tb=short"
