[project]
name = "clawdnd-rules"
version = "0.0.1"
description = "WorldOS rules MCP: D&D 5e SRD lookup (spells, monsters, conditions, rules) with fuzzy matching."
requires-python = ">=3.11,<3.13"
dependencies = [
  "mcp>=1.2.0",
  "httpx>=0.27",
  "rapidfuzz>=3.6",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6.0", "pytest-timeout>=2.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--tb=short"
