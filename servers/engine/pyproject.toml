[project]
name = "worldos-engine"
version = "0.0.1"
description = "WorldOS game-engine MCP: authoritative D&D 5e state, dice, combat, encounters, XP, persistence."
requires-python = ">=3.11,<3.13"
dependencies = [
  "mcp>=2.0.0",
  "pydantic>=2.6",
]

[dependency-groups]
# numpy + pillow: qa/walk_test.py's visual mode (pixel-diff actor localization) imports them lazily;
# declared here so `--group dev` runs its full unit suite (they were venv-strays before — 3 silent fails).
dev = ["pytest>=9.1.1", "pytest-cov>=6.0", "pytest-timeout>=2.3", "numpy>=1.26", "pillow>=10.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--tb=short"
