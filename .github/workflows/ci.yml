name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Engine tests
        # Phase-1 (DETERMINISTIC-3): coverage is report-only (no --cov-fail-under yet) so it
        # surfaces untested paths without flaking CI. pytest-cov is in the dev group.
        run: uv run --directory servers/engine --group dev pytest -q --cov=. --cov-report=term-missing
      - name: Rules tests
        env:
          CLAWDND_RULES_OFFLINE: "1"
        run: uv run --directory servers/rules --group dev pytest -q --cov=. --cov-report=term-missing
      - name: Voice tests (torch-free; null backend + static metadata)
        run: uv run --directory servers/voice --group dev pytest -q --cov=. --cov-report=term-missing
      - name: Single-flight launch-guard test (scripts/launch_common.sh lock)
        # Pure bash + POSIX mkdir/kill -0/rm — no uv/claude/viewer. Proves a second concurrent
        # play_party.sh cold-open is cleanly rejected and the lock self-heals (release / dead holder).
        run: bash qa/test_play_party_single_flight.sh
      - name: Velocity-gates test (fast_gate green-cache + release_gate RAM preflight; pure bash)
        # Phase-1 (VELOCITY-1/4): proves the opt-in fast_gate cache short-circuits a same-SHA
        # rerun and the release_gate RAM preflight refuses a sweep under a forced-low-RAM stub.
        run: bash qa/test_velocity_gates.sh
      - name: Dry-run-gate-fix test (median-of-N + verdict logic via stubbed runner; pure bash)
        # Phase-2 (AUTONOMY-6): proves the agent's pre-PR fix self-check computes the median + GREEN/
        # below-bar verdict + exit codes correctly, with the live runner stubbed (no model key).
        run: bash qa/test_dry_run_gate_fix.sh

  viewer-tests:
    # The viewer is where most recent regressions landed, but its suite was not in
    # CI (three viewer PRs each had to caveat "verified locally"). This job runs the
    # whole viewer/tests/ suite, single-process, on push + PR so viewer regressions
    # are caught in CI like the engine/rules/voice suites.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install Node (for the JSX behaviour harness)
        # A subset of viewer tests transpile the real .jsx through the VENDORED
        # babel-standalone (viewer/openworlds/vendor/) and run it under node's `vm`.
        # Babel is vendored and the harness only requires node built-ins (fs, vm), so
        # NO `npm install` is needed — just a node binary on PATH. Without node these
        # tests `skipIf` themselves; we install it so they actually RUN in CI.
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Create + activate a venv with the viewer test deps
        # Most viewer tests import viewer/server.py (stdlib-only at import time) and need
        # no third-party deps. The exception is test_portrait_gen's real-subprocess test,
        # which shells the engine via `uv run --directory servers/engine --no-project`
        # (a bare interpreter) to prove the null image provider opens no socket. That
        # child resolves the ACTIVE venv, so installing pydantic (the engine's runtime
        # dep, declared in servers/engine/pyproject.toml) here lets the engine subprocess
        # import `store`/`imagegen` and the test runs instead of erroring on import.
        run: |
          uv venv .venv-viewer --python 3.12
          echo "VIRTUAL_ENV=$PWD/.venv-viewer" >> "$GITHUB_ENV"
          echo "$PWD/.venv-viewer/bin" >> "$GITHUB_PATH"
          uv pip install --python .venv-viewer pydantic pytest
      - name: Viewer tests (single-process; JSX harness via node + vendored babel)
        # -p no:xdist keeps this single-process (no parallel workers) — lean by design.
        run: python -m pytest viewer/tests -q -p no:xdist

  qa-release-gate-tests:
    # #729: the qa/ release-gate + scoring + wrapper-contract tests were NEVER in CI — the `test`
    # job only collects servers/*/tests/. A *tested* crash (#723 `build_shas`, caught by
    # test_release_readiness.py's 4 build_sha tests) shipped because CI never ran them. Gate the
    # release-authority surface (release_readiness.py, scores_db.py, the play-wrapper contracts) so
    # a regression there can no longer merge green.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: QA release-gate + scoring + wrapper-contract tests
        # Run from the engine venv (pydantic etc. on path) with cwd=servers/engine, so the qa tests'
        # `import server/store` resolves and release_readiness.py subprocesses use the same interpreter.
        run: |
          uv run --directory servers/engine --group dev python -m pytest -q -p no:xdist \
            ../../qa/test_release_readiness.py \
            ../../qa/test_release_readiness_scope.py \
            ../../qa/test_scores_db_comparability.py \
            ../../qa/test_scores_db.py \
            ../../qa/test_release_gate_static.py \
            ../../qa/test_ui_playtest_score_image_outcomes.py \
            ../../qa/test_claude_auth_isolation.py \
            ../../qa/test_snapshot_world_state.py \
            ../../qa/test_score_determinism.py \
            ../../qa/test_lens_variance.py \
            ../../qa/test_detect_regression.py \
            ../../qa/test_root_cause_analyzer.py \
            ../../qa/test_evidence_audit.py \
            ../../qa/test_triage_failure.py \
            ../../qa/test_behavioral_gate_corpus.py \
            ../../qa/test_deterministic_rri_gate.py \
            ../../qa/test_orchestrate_split_rri.py \
            ../../qa/test_visual_regression_check.py

  server-contracts:
    # Phase-1 (DETERMINISTIC-2): deterministic cross-service MCP contract tests
    # (engine<->rules<->voice; null/torch-free voice backend, offline rules). The rules
    # boundary runs through the rules venv (rapidfuzz), so sync BOTH servers before running.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync rules venv (rapidfuzz/httpx for the offline rules worker)
        env:
          CLAWDND_RULES_OFFLINE: "1"
        run: uv sync --directory servers/rules
      - name: Cross-service MCP contract tests
        env:
          CLAWDND_RULES_OFFLINE: "1"
        run: uv run --directory servers/engine --group dev python -m pytest -q -p no:xdist ../../servers/integration_tests

  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: License / content gate
        run: python3 scripts/license_check.py
